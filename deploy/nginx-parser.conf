# Nginx reverse-proxy for the Parser web UI.
# Put this at /etc/nginx/sites-available/parser, then:
#   ln -s /etc/nginx/sites-available/parser /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d parser.example.ru     # adds the SSL block automatically
#
# Replace parser.example.ru with your real domain.

server {
    listen 80;
    server_name parser.example.ru;

    # SSE (the live log stream) needs buffering off and a long read timeout.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/log-stream) — disable buffering, keep alive long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # Large CSV downloads
    client_max_body_size 100M;
}
