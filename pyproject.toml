[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "competitor-monitor"
version = "0.1.0"
description = "Price & specs monitoring for pneumatic/compressor equipment competitors"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selectolax>=0.3.17",
    "fake-useragent>=1.5",
    "tenacity>=8.2",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
js = ["playwright>=1.40"]

[project.scripts]
monitor = "monitor.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["monitor*"]
